# Site Info
title:              "podypodpod.github.io"
description:        "Hi I'm Dave. I build systems and teams, currently running KWS at Epic Games."
google_verify:      # Put your Google Verification here

# Author Info
author_name:        "David Lomas"
author_email:       davlomas3@gmail.com
author_gravatar:    4d5595d5d5b6a046fbf6c55e09251999 # Gravatar md5 hash
twitter_username:   dlomas20
github_username:    podypodpod # GitHub username

# Site Settings
url:                "https://podypodpod.github.io"
baseurl:            "" # Base URL must end WITHOUT a slash, default: ""
permalink:          /notes/:title # Post permalink
timezone:           Europe/London # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

# Site Build
highlighter:        rouge
#markdown:           redcarpet
#redcarpet:
#    extensions:     ["no_intra_emphasis", "fenced_code_blocks", "autolink", "tables", "with_toc_data", "highlight", "footnotes"]
markdown:           kramdown
kramdown:
    input:          GFM
sass:
    style:          :compressed

# Other Params
include:            [ "robots.txt" ]
exclude:            [ "LICENSE", "README.md", "CNAME", "vendor", "Gemfile" ]
plugins:
  - jekyll-sitemap

compress_html:
    clippings:      all
    ingore:
        envs:       [ "test" ]

defaults:
  -
    scope:
      path:         ""
    values:
      layout:       "null"
  -
    scope:
      type:         "pages"
    values:
      layout:       "page"
  -
    scope:
      type:         "posts"
    values:
      layout:       "post"
